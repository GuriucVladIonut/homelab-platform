apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-traefik
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure-base
  path: ./infra/infrastructure/traefik/base
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: ingress
  sourceRef:
    kind: GitRepository
    name: flux-system
