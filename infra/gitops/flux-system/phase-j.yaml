apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-postgresql
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure-base
  path: ./infra/infrastructure/postgresql
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: postgresql
      namespace: database
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications-catalog
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure-postgresql
    - name: infrastructure-traefik-config
  path: ./infra/infrastructure/catalog
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: catalog
      namespace: catalog
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
