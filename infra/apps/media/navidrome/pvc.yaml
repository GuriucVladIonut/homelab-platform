apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: homelab-media
  volumeName: media-navidrome-config
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-music
  namespace: media
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: homelab-media
  volumeName: media-music
  resources:
    requests:
      storage: 100Gi
