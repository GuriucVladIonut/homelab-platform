apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
  labels: {app.kubernetes.io/name: navidrome, app.kubernetes.io/part-of: homelab-media}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: navidrome}
  template:
    metadata:
      labels: {app.kubernetes.io/name: navidrome}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: navidrome
          image: docker.io/deluan/navidrome:0.54.5
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 4533}]
          env:
            - {name: ND_MUSICFOLDER, value: /music}
            - {name: ND_DATAFOLDER, value: /data}
            - {name: ND_SCANSCHEDULE, value: "0"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /ping, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /ping, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          volumeMounts:
            - {name: config, mountPath: /data}
            - {name: music, mountPath: /music, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: navidrome-config}}
        - {name: music, persistentVolumeClaim: {claimName: navidrome-music}}
        - {name: tmp, emptyDir: {}}
