apiVersion: apps/v1
kind: Deployment
metadata: {name: jellyfin, namespace: media}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: jellyfin}}
  template:
    metadata: {labels: {app.kubernetes.io/name: jellyfin}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: jellyfin
          image: docker.io/jellyfin/jellyfin:10.10.7
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8096}]
          env: [{name: JELLYFIN_PublishedServerUrl, value: https://media.homelab.gvlad.dev}]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cache, mountPath: /cache}
            - {name: movies, mountPath: /media/movies, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 1Gi}}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30, periodSeconds: 30}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: jellyfin-config}}
        - {name: cache, emptyDir: {sizeLimit: 2Gi}}
        - {name: movies, persistentVolumeClaim: {claimName: jellyfin-movies, readOnly: true}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
