apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: validation
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`validation.homelab.gvlad.dev`)
      kind: Rule
      middlewares:
        - name: security-headers
      services:
        - name: whoami
          port: 80
  tls: {}
