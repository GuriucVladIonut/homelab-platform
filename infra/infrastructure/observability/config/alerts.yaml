apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-baseline
  namespace: observability
  labels:
    release: observability
spec:
  groups:
    - name: homelab-platform
      rules:
        - alert: HomelabNodeUnavailable
          expr: up{job=~".*node-exporter.*"} == 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Homelab node exporter target is unavailable
            description: The node exporter target has been down for 10 minutes.
        - alert: HomelabKubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: Kubernetes node is not Ready
            description: A Kubernetes node has not reported Ready for 10 minutes.
        - alert: HomelabRootFilesystemLow
          expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Root filesystem has less than 15 percent free space
            description: Free space on the root filesystem is below the operating threshold.
        - alert: HomelabDataFilesystemLow
          expr: node_filesystem_avail_bytes{mountpoint="/srv/homelab",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/srv/homelab",fstype!~"tmpfs|overlay"} < 0.15
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: /srv/homelab has less than 15 percent free space
            description: The homelab data filesystem is below the operating threshold.
        - alert: HomelabMemoryPressure
          expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 85
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Host memory usage is persistently high
            description: Available memory has remained below 15 percent for 15 minutes.
        - alert: HomelabPodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[10m]) >= 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: A homelab pod is crash looping
            description: A pod has remained in CrashLoopBackOff for at least 10 minutes.
        - alert: HomelabPodPending
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: A homelab pod is stuck Pending
            description: A pod has remained Pending for at least 15 minutes.
        - alert: HomelabDaemonSetUnavailable
          expr: kube_daemonset_status_number_available < kube_daemonset_status_desired_number_scheduled
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: A DaemonSet has unavailable replicas
            description: A DaemonSet has fewer available pods than scheduled pods.
        - alert: HomelabStatefulSetUnavailable
          expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: A StatefulSet has unavailable replicas
            description: A StatefulSet has fewer ready replicas than requested.
        - alert: HomelabCertificateExpirySoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 604800
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: A managed certificate expires within seven days
            description: cert-manager reports a certificate nearing expiration.
        - alert: HomelabPrometheusTargetDown
          expr: up == 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: A Prometheus target is down
            description: A configured Prometheus scrape target has been unavailable for 10 minutes.
        - alert: HomelabNodeExporterUnavailable
          expr: absent(up{job=~".*node-exporter.*"})
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: Node exporter target is absent
            description: Prometheus cannot find a node-exporter target.
