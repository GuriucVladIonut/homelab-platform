apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-baseline
  namespace: observability
  labels:
    release: observability
spec:
  groups:
    - name: homelab-baseline
      rules:
        - alert: HomelabNodeExporterDown
          expr: up{job=~".*node-exporter.*"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Homelab node exporter is down
            description: No node-exporter metrics have been scraped for 10 minutes.
        - alert: HomelabDiskSpaceLow
          expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Homelab root filesystem space is low
            description: The root filesystem has less than 15 percent free space.
        - alert: HomelabPodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[10m]) >= 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A homelab pod is crash looping
            description: A pod has remained in CrashLoopBackOff for at least 10 minutes.
